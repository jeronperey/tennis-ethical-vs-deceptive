<svg xmlns="http://www.w3.org/2000/svg" viewBox="0,0,620,570" width="620" height="570" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><rect width="620" height="570" fill="#fff" stroke="#d9dde1"></rect><text x="30" y="44" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Do aces win matches?</text><text x="30" y="72" font-size="14" font-weight="400" fill="#5b626b" text-anchor="start">Share of men's ATP tour matches won by the player who hit more aces,</text><text x="30" y="92" font-size="14" font-weight="400" fill="#5b626b" text-anchor="start">grouped by how many more aces they hit. 2015–2024.</text><text x="30" y="112" font-size="14" font-weight="400" fill="#5b626b" text-anchor="start">An ace is a serve the opponent never touches.</text><text x="30" y="140" font-size="13" font-weight="700" fill="#5b626b" text-anchor="start">Extra aces hit</text><text x="350" y="140" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">50% = coin flip</text><text x="30" y="178" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">1–2 aces</text><text x="30" y="198" font-size="13" font-weight="400" fill="#5b626b" text-anchor="start">n = 7,540</text><rect x="150" y="156" width="227.36" height="52" rx="3" fill="#2f6f8f"></rect><text x="387.36" y="189" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">56.8%</text><text x="30" y="250" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">3–5 aces</text><text x="30" y="270" font-size="13" font-weight="400" fill="#5b626b" text-anchor="start">n = 7,646</text><rect x="150" y="228" width="254.68" height="52" rx="3" fill="#2f6f8f"></rect><text x="414.68" y="261" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">63.7%</text><text x="30" y="322" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">6–9 aces</text><text x="30" y="342" font-size="13" font-weight="400" fill="#5b626b" text-anchor="start">n = 5,096</text><rect x="150" y="300" width="284.32" height="52" rx="3" fill="#2f6f8f"></rect><text x="444.32" y="333" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">71.1%</text><text x="30" y="394" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">10+ aces</text><text x="30" y="414" font-size="13" font-weight="400" fill="#5b626b" text-anchor="start">n = 3,441</text><rect x="150" y="372" width="289" height="52" rx="3" fill="#2f6f8f"></rect><text x="449" y="405" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">72.3%</text><line x1="350" x2="350" y1="148" y2="424" stroke="#fff" stroke-width="5" opacity="0.9"></line><line x1="350" x2="350" y1="148" y2="424" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="5 4"></line><line x1="150" x2="550" y1="440" y2="440" stroke="#c9ccd0"></line><line x1="150" x2="150" y1="440" y2="446" stroke="#c9ccd0"></line><text x="150" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">0%</text><line x1="250" x2="250" y1="440" y2="446" stroke="#c9ccd0"></line><text x="250" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">25%</text><line x1="350" x2="350" y1="440" y2="446" stroke="#c9ccd0"></line><text x="350" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">50%</text><line x1="450" x2="450" y1="440" y2="446" stroke="#c9ccd0"></line><text x="450" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">75%</text><line x1="550" x2="550" y1="440" y2="446" stroke="#c9ccd0"></line><text x="550" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">100%</text><text x="350" y="486" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">Share of matches won by the player with more aces (%)</text><text x="30" y="506" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">This shows association, not cause: stronger servers both hit more aces and win more.</text><text x="30" y="522" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">23,723 of 27,672 matches analyzed. Excluded: other surfaces (72),</text><text x="30" y="538" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">unfinished matches (905), missing ace counts (856), tied ace counts (2,116).</text><text x="30" y="554" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Source: Jeff Sackmann, Tennis Abstract (CC BY-NC-SA 4.0).</text></svg>