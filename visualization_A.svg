<svg xmlns="http://www.w3.org/2000/svg" viewBox="0,0,620,570" width="620" height="570" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img"><rect width="620" height="570" fill="#fff" stroke="#d9dde1"></rect><text x="30" y="44" font-size="26" font-weight="800" fill="#1f2328" text-anchor="start">Do aces win matches? Hit more, win more.</text><text x="30" y="72" font-size="14" font-weight="400" fill="#5b626b" text-anchor="start">Share of ATP matches won by the player who hit more aces,</text><text x="30" y="92" font-size="14" font-weight="400" fill="#5b626b" text-anchor="start">grouped by how many more aces they hit. 2015–2024.</text><text x="30" y="140" font-size="13" font-weight="700" fill="#5b626b" text-anchor="start">Extra aces hit</text><text x="30" y="189" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">1–2 aces</text><rect x="150" y="156" width="109.44000000000005" height="52" rx="3" fill="#a9d3c0"></rect><text x="269.44000000000005" y="189" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">56.8%</text><text x="30" y="261" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">3–5 aces</text><rect x="150" y="228" width="218.72000000000003" height="52" rx="3" fill="#6fb89a"></rect><text x="378.72" y="261" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">63.7%</text><text x="30" y="333" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">6–9 aces</text><rect x="150" y="300" width="337.28" height="52" rx="3" fill="#3f9a78"></rect><text x="497.28" y="333" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">71.1%</text><text x="30" y="405" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">10+ aces</text><rect x="150" y="372" width="356" height="52" rx="3" fill="#1d7a57"></rect><text x="516" y="405" font-size="21" font-weight="800" fill="#1f2328" text-anchor="start">72.3%</text><line x1="150" x2="550" y1="440" y2="440" stroke="#c9ccd0"></line><line x1="150" x2="150" y1="440" y2="446" stroke="#c9ccd0"></line><text x="150" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">50%</text><line x1="230" x2="230" y1="440" y2="446" stroke="#c9ccd0"></line><text x="230" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">55%</text><line x1="310" x2="310" y1="440" y2="446" stroke="#c9ccd0"></line><text x="310" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">60%</text><line x1="390" x2="390" y1="440" y2="446" stroke="#c9ccd0"></line><text x="390" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">65%</text><line x1="470" x2="470" y1="440" y2="446" stroke="#c9ccd0"></line><text x="470" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">70%</text><line x1="550" x2="550" y1="440" y2="446" stroke="#c9ccd0"></line><text x="550" y="464" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">75%</text><text x="350" y="486" font-size="13" font-weight="400" fill="#5b626b" text-anchor="middle">Share of matches won by the player with more aces (%)</text><text x="30" y="514" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start">With 10+ extra aces, a player is 27% more likely to win than with 1–2.</text><text x="30" y="532" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">More aces, more wins, on every court.</text><text x="30" y="548" font-size="12" font-weight="400" fill="#5b626b" text-anchor="start">Source: Jeff Sackmann, Tennis Abstract ATP match data, 2015–2024.</text></svg>